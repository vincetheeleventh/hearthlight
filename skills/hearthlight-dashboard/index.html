<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hearthlight Intake</title>
<style>
:root{color-scheme:light;--paper:#f7f1e5;--card:#fffdf8;--ink:#2b2620;--muted:#6b6154;--line:#d9cdb8;--ember:#c4552a;--green:#4a7c59}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,sans-serif}.wrap{max-width:1040px;margin:auto;padding:28px 22px 70px}header,.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{margin-bottom:24px}h1,h2,h3,p{margin-top:0}.grow{flex:1}.button,button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 13px;cursor:pointer;text-decoration:none}.primary{background:var(--ember);border-color:var(--ember);color:white}.projects,.zones,.axes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card,.zone,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.card{cursor:pointer}.card:hover,.zone:hover{border-color:var(--ember)}.muted,small{color:var(--muted)}.axis strong{display:block;font-size:18px}.axis span{display:block;color:var(--muted);font-size:12px}.zone{border-style:dashed}.zone.over{border-color:var(--ember);background:#fff3e8}.zone.filled{border-style:solid;border-color:var(--green)}.zone input{width:100%;margin-top:8px;padding:7px;border:1px solid var(--line);border-radius:7px}.section{margin:26px 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}textarea{width:100%;min-height:100px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--paper)}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:9px 15px;border-radius:9px;opacity:0}#toast.show{opacity:1}.error{color:var(--ember)}
</style>
</head>
<body><main class="wrap">
<header><h1>Hearthlight Intake</h1><span class="muted" id="stamp"></span><span class="grow"></span><a class="button primary" href="http://127.0.0.1:8765/?space=projects">Open Studio</a><button onclick="newProject()">New project</button></header>
<div id="app"></div>
</main><div id="toast"></div><input id="picker" type="file" multiple hidden>
<script>
let data=null,active=null,pickZone=null;
const esc=value=>(value??"").toString().replace(/[&<>\"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[char]));
function toast(message){const node=document.querySelector("#toast");node.textContent=message;node.classList.add("show");setTimeout(()=>node.classList.remove("show"),2200)}
function tally(counts){return Object.entries(counts||{}).map(([state,count])=>`${count} ${state.replaceAll("-"," ")}`).join(" · ")||"none"}
async function load(){const response=await fetch("/status.json",{cache:"no-store"});data=await response.json();document.querySelector("#stamp").textContent=data.generated_at;render()}
function render(){const app=document.querySelector("#app");if(!active){app.innerHTML=`<div class="section">Projects</div><div class="projects">${data.projects.map(project=>`<article class="card" onclick="active='${esc(project.slug)}';render()"><h2>${esc(project.slug)}</h2><p>${esc(project.state.nextAction)}</p><small>${project.state.shots} shots${project.days_idle==null?"":` · touched ${project.days_idle===0?"today":project.days_idle+"d ago"}`}</small></article>`).join("")}</div>`;return}const project=data.projects.find(item=>item.slug===active);const state=project.state;app.innerHTML=`<div class="row"><button onclick="active=null;render()">← Projects</button><h2>${esc(project.slug)}</h2></div>${state.available?`<div class="axes"><div class="panel axis"><strong>${state.shots}</strong><span>shots</span></div><div class="panel axis"><strong>${esc(tally(state.design))}</strong><span>design</span></div><div class="panel axis"><strong>${esc(tally(state.production))}</strong><span>production</span></div><div class="panel axis"><strong>${esc(tally(state.inputs))}</strong><span>inputs</span></div></div><p class="panel">${esc(state.nextAction)}</p>`:`<p class="panel error">${esc(state.error)}</p>`}<div class="section">Drop assets</div><div class="zones">${project.zones.map(zone=>`<article class="zone ${zone.count?"filled":""}" data-zone="${zone.id}"><h3>${zone.icon} ${esc(zone.label)}</h3><p>${esc(zone.hint)}</p><small>${zone.count} file${zone.count===1?"":"s"}${zone.recent.length?` · ${zone.recent.map(esc).join(" · ")}`:""}</small>${zone.named?`<input id="sub-${zone.id}" placeholder="${esc(zone.name_label)}" onclick="event.stopPropagation()">`:""}</article>`).join("")}</div><div class="section">Typed intake</div><div class="panel"><textarea id="note" placeholder="Raw direction, critique, or idea"></textarea><div class="row"><button class="primary" onclick="sendNote('rant')">Save direction</button><button onclick="sendNote('idea')">Save idea</button></div></div>`;wireZones(project)}
function wireZones(project){document.querySelectorAll(".zone").forEach(element=>{const id=element.dataset.zone;element.ondragover=event=>{event.preventDefault();element.classList.add("over")};element.ondragleave=()=>element.classList.remove("over");element.ondrop=event=>{event.preventDefault();element.classList.remove("over");upload(id,[...event.dataTransfer.files],project)};element.onclick=()=>{pickZone=id;document.querySelector("#picker").click()}})}
document.querySelector("#picker").onchange=event=>{const project=data.projects.find(item=>item.slug===active);if(pickZone)upload(pickZone,[...event.target.files],project);event.target.value=""};
async function upload(zoneId,files,project){const zone=project.zones.find(item=>item.id===zoneId);let sub="";if(zone.named){sub=(document.querySelector(`#sub-${zoneId}`)?.value||"").trim().toLowerCase().replace(/\s+/g,"-");if(!sub){toast(`Enter ${zone.name_label} first`);return}}for(const file of files){const query=new URLSearchParams({project:active,zone:zoneId,name:file.name,sub});const response=await fetch(`/api/upload?${query}`,{method:"POST",body:file});const result=await response.json();toast(result.saved?`Saved ${result.saved}`:result.error)}await load()}
async function sendNote(kind){const text=document.querySelector("#note").value.trim();if(!text)return toast("Nothing to save");const response=await fetch("/api/note",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({project:active,kind,text})});const result=await response.json();if(result.saved){document.querySelector("#note").value="";toast(`Saved ${result.saved}`)}else toast(result.error)}
async function newProject(){const slug=prompt("Project slug");if(!slug)return;const response=await fetch("/api/new-project",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({slug})});const result=await response.json();toast(result.created?`Created ${result.created}; fill project.json next`:result.error);await load()}
load();setInterval(load,60000);
</script></body></html>
